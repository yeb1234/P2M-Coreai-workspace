# Alembic configuration for P2 Learning OS.
#
# NOTE: keep this file pure ASCII. Alembic reads it with the system locale
# encoding (GBK on Windows), so non-ASCII comments raise UnicodeDecodeError
# before anything else runs. All the explanation lives in alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

# Intentionally empty. alembic/env.py reads app.database.settings.database_url
# and sets the URL itself. One-off override:
#   alembic -x db_url=postgresql+psycopg://user:pass@host/db upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
