# P2 批处理角色编排
#
# 角色边界（只按队列分工，不靠宿主脚本切模型）：
#   audio-prep             CPU 抽 WAV（Docker 内 ffmpeg）
#   worker / worker2       台式机 GPU 转写（ai_jobs）
#   vector-worker          台式机向量化（background，走桌面 bge-m3）
#   summary-worker-laptop  笔记本 AI 总结（summary_jobs，走 250:1234 的宿主桥）
#
# 所有常驻服务都由 Docker 管生命周期，restart: unless-stopped；
# 不再由 Windows 计划任务在 backend 容器里 nohup 临时 Python 进程。

services:
  audio-prep:
    restart: unless-stopped
    environment:
      AUDIO_PREP_CONCURRENCY: "${AUDIO_PREP_CONCURRENCY:-1}"

  # 台式机转写主 worker。只吃 ai_jobs，避免和向量 worker 抢 background。
  worker:
    image: p2-siteyeb-backend:3.0-batch
    restart: unless-stopped
    environment:
      WORKER_NAME: "desktop-transcribe-1"
      WORKER_QUEUES: "ai_jobs"
      WORKER_SECONDARY: "0"
      WORKER_SKIP_CLEAN: "1"
      WORKER_FORCE_REGISTER: "1"
      # 台式机自己的 LM Studio 已改回 1234；本地优先，失败再走外部 API。
      LLM_USAGE_POLICY_OVERRIDE: "local_first"
      LOCAL_LLM_BASE_URL_OVERRIDE: "http://host.docker.internal:1234/v1"
      LOCAL_LLM_MODEL_OVERRIDE: "qwen/qwen3-4b-2507"
      OPENAI_BASE_URL: "http://host.docker.internal:1234/v1"
      OPENAI_MODEL: "qwen/qwen3-4b-2507"
      EMBEDDING_BASE_URL: "http://host.docker.internal:1234/v1"
      EMBEDDING_MODEL: "text-embedding-bge-m3@q8_0"
      EMBEDDING_BATCH_SIZE: "64"
      WHISPER_BATCH_SIZE: "4"
      WHISPER_DIRECT_MEDIA: "0"
      DEVICE_TYPE: "cuda"
      WHISPER_COMPUTE_TYPE: "float16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 第二个转写 worker：只做 secondary，不参与启动恢复，避免两个进程
  # 同时扫 4k+ DB 队列。GPU 仍由 compose 的 gpu 覆盖提供。
  worker2:
    extends:
      file: docker-compose.yml
      service: worker
    image: p2-siteyeb-backend:3.0-batch
    environment:
      WORKER_NAME: "desktop-transcribe-2"
      WORKER_QUEUES: "ai_jobs"
      WORKER_SECONDARY: "1"
      WORKER_SKIP_CLEAN: "1"
      WORKER_FORCE_REGISTER: "1"
      LLM_USAGE_POLICY_OVERRIDE: "local_first"
      LOCAL_LLM_BASE_URL_OVERRIDE: "http://host.docker.internal:1234/v1"
      LOCAL_LLM_MODEL_OVERRIDE: "qwen/qwen3-4b-2507"
      OPENAI_BASE_URL: "http://host.docker.internal:1234/v1"
      OPENAI_MODEL: "qwen/qwen3-4b-2507"
      EMBEDDING_BASE_URL: "http://host.docker.internal:1234/v1"
      EMBEDDING_MODEL: "text-embedding-bge-m3@q8_0"
      EMBEDDING_BATCH_SIZE: "64"
      WHISPER_BATCH_SIZE: "4"
      WHISPER_DIRECT_MEDIA: "0"
      DEVICE_TYPE: "cuda"
      WHISPER_COMPUTE_TYPE: "float16"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 只消费 background 的向量 worker：不占 GPU，embedding 走台式机 1234。
  # 之前它被 profile 藏起来，结果笔记本既要总结又要向量，两个模型互相挤显存；
  # 现在默认随 compose 启动，笔记本只保留 summary_jobs。
  vector-worker:
    extends:
      file: docker-compose.yml
      service: worker
    image: p2-siteyeb-backend:3.0-batch
    restart: unless-stopped
    environment:
      WORKER_SECONDARY: "1"
      WORKER_SKIP_CLEAN: "1"
      WORKER_FORCE_REGISTER: "1"
      WORKER_QUEUES: "background"
      WORKER_NAME: "vector-worker"
      EMBEDDING_BASE_URL: "http://host.docker.internal:1234/v1"
      EMBEDDING_MODEL: "text-embedding-bge-m3@q8_0"
      EMBEDDING_BATCH_SIZE: "64"
      OPENAI_BASE_URL: "http://host.docker.internal:1234/v1"
      LOG_FILE_NAME: "vector-worker"
    healthcheck:
      disable: true

  # 可选：笔记本彻底离线时的台式机总结兜底。默认不启动，避免和笔记本抢
  # summary_jobs；需要手动接管时用 --profile summary-fallback 启动。
  summary-worker-desktop:
    extends:
      file: docker-compose.yml
      service: worker
    image: p2-siteyeb-backend:3.0-batch
    profiles: ["summary-fallback"]
    environment:
      WORKER_SECONDARY: "1"
      WORKER_SKIP_CLEAN: "1"
      WORKER_FORCE_REGISTER: "1"
      WORKER_QUEUES: "summary_jobs"
      WORKER_NAME: "summary-worker-desktop"
      OPENAI_BASE_URL: "http://host.docker.internal:1234/v1"
      OPENAI_MODEL: "qwen/qwen3-4b-2507"
      LOCAL_LLM_BASE_URL_OVERRIDE: "http://host.docker.internal:1234/v1"
      LOCAL_LLM_MODEL_OVERRIDE: "qwen/qwen3-4b-2507"
      LLM_USAGE_POLICY_OVERRIDE: "local_only"
      LLM_CONTEXT_TOKEN_LIMIT: "12000"
      LOG_FILE_NAME: "summary-worker-desktop"
    volumes:
      - ./backend/app/worker.py:/app/app/worker.py:ro
      - ./backend/app/services/ai_jobs.py:/app/app/services/ai_jobs.py:ro
    healthcheck:
      disable: true

  # 笔记本总结 worker：消费 summary_jobs，不再碰 background。
  # 笔记本真实端点始终是 192.168.3.250:1234；容器内经宿主机 1236 桥访问，
  # 1236 只是桥的监听端口，不是笔记本端口。
  summary-worker-laptop:
    extends:
      file: docker-compose.yml
      service: worker
    image: p2-siteyeb-backend:3.0-batch
    environment:
      WORKER_SECONDARY: "1"
      WORKER_SKIP_CLEAN: "1"
      WORKER_QUEUES: "summary_jobs"
      WORKER_FORCE_REGISTER: "1"
      WORKER_NAME: "summary-worker-laptop"
      OPENAI_BASE_URL: "http://192.168.65.254:1236/v1"
      OPENAI_MODEL: "qwen/qwen3-4b-2507"
      LOCAL_LLM_BASE_URL_OVERRIDE: "http://192.168.65.254:1236/v1"
      LOCAL_LLM_MODEL_OVERRIDE: "qwen/qwen3-4b-2507"
      LLM_USAGE_POLICY_OVERRIDE: "local_only"
      LLM_CONTEXT_TOKEN_LIMIT: "12000"
      EMBEDDING_BASE_URL: "http://192.168.65.254:1236/v1"
      EMBEDDING_MODEL: "text-embedding-bge-m3@q8_0"
      EMBEDDING_BATCH_SIZE: "64"
      LOG_FILE_NAME: "summary-worker-laptop"
    volumes:
      - ./backend/app/worker.py:/app/app/worker.py:ro
      - ./backend/app/services/ai_jobs.py:/app/app/services/ai_jobs.py:ro
      - ./backend/app/services/background_tasks.py:/app/app/services/background_tasks.py:ro
    healthcheck:
      disable: true
