# P2 演示中心：静态页面 + 监控 API 同源代理
# 挂载到 P2 前端 nginx 的 /demo/ 路径，不占用新端口。
location = /demo {
    return 301 /demo/;
}

location ^~ /demo/ {
    alias /demo-site/;
    index index.html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
}

# 监控页调用 /demo/api/status；转发到宿主机 12702 的只读监控服务。
location = /demo/api/status {
    proxy_pass http://host.docker.internal:12702/api/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
}

# 预留同路径的其它只读监控端点；避免以后加接口又要改配置。
location /demo/api/ {
    proxy_pass http://host.docker.internal:12702/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
