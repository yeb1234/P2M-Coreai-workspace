# PostgreSQL + pgvector for P2 Learning OS
#
# 独立于主 docker-compose.yml，可单独启停，便于从 SQLite 平滑迁移与回滚。
#   docker compose -f docker-compose.pg.yml --env-file .env up -d
#
# 调优面向 16GB 内存的单机：shared_buffers 2GB，建 HNSW 索引时
# maintenance_work_mem 2GB，random_page_cost 1.1 表示 SSD。

services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg17
    container_name: siteyeb-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p2learning}
      POSTGRES_USER: ${POSTGRES_USER:-p2user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - work_mem=64MB
      - -c
      - effective_cache_size=6GB
      - -c
      - max_connections=120
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=500
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - siteyeb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p2user} -d ${POSTGRES_DB:-p2learning}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  siteyeb-pgdata:
    name: siteyeb-pgdata
