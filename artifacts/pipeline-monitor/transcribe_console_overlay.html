<!-- P2_TRANSCRIBE_CSS -->
<style>
  .tc-deck {
    margin: 14px 0 18px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .tc-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .tc-head h2 { margin: 2px 0 4px; font-size: 22px; letter-spacing: -.02em; }
  .tc-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .tc-state {
    flex: 0 0 auto;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .tc-state.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .tc-state.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
  .tc-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 10px;
    align-items: end;
    margin-top: 10px;
  }
  .tc-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .tc-field > span { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .tc-field input, .tc-field select {
    width: 100%;
    min-height: 34px;
    padding: 7px 9px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  .tc-field input:focus, .tc-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 12%, transparent); }
  .tc-field-wide { grid-column: span 5; }
  .tc-field-mid { grid-column: span 2; }
  .tc-field-small { grid-column: span 1; }
  .tc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; grid-column: span 4; }
  .tc-btn {
    min-height: 34px;
    padding: 7px 11px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .tc-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tc-btn:disabled { opacity: .45; cursor: wait; }
  .tc-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .tc-btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .tc-btn.warn { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
  .tc-hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .tc-hint strong { color: var(--text); font-weight: 600; }
  .tc-message {
    display: none;
    margin-top: 10px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .tc-message.show { display: block; }
  .tc-message.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .tc-message.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 30%, var(--line)); }
  .tc-table-wrap {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: auto;
    max-height: 320px;
    background: var(--panel-2);
  }
  .tc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tc-table th, .tc-table td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle; }
  .tc-table th { position: sticky; top: 0; z-index: 1; color: var(--muted); background: var(--panel); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .tc-table tr:last-child td { border-bottom: 0; }
  .tc-table tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .tc-check { width: 32px; text-align: center !important; }
  .tc-check input { accent-color: var(--accent); }
  .tc-title { max-width: 340px; }
  .tc-title b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .tc-title small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; }
  .tc-pill { display: inline-block; padding: 2px 6px; border: 1px solid var(--line); border-radius: var(--radius-pill); color: var(--muted); font-size: 10px; white-space: nowrap; }
  .tc-pill.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .tc-pill.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
  .tc-pill.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 35%, var(--line)); }
  .tc-empty { padding: 18px 10px; color: var(--muted); text-align: center; font-size: 12px; }
  .tc-selection { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .tc-selection .tc-hint { margin-left: auto; }
  @media (max-width: 900px) {
    .tc-head { flex-direction: column; }
    .tc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tc-field-wide, .tc-actions { grid-column: span 2; }
    .tc-field-mid, .tc-field-small { grid-column: span 1; }
    .tc-table { min-width: 620px; }
    .tc-title { max-width: 220px; }
    .tc-table th, .tc-table td { padding: 7px 6px; }
  }
</style>
<!-- /P2_TRANSCRIBE_CSS -->

<!-- P2_TRANSCRIBE_HTML -->
<section class="tc-deck" id="transcribe-console" aria-label="P2 Transcribe 控制台">
  <div class="tc-head">
    <div>
      <span class="eyebrow">P2 7.2 TRANSCRIBE / CONTROL PLANE</span>
      <h2>转写控制台</h2>
      <p>主站只负责视频浏览与字幕阅读；扫描、转写、总结和队列操作统一在这里完成。</p>
    </div>
    <span class="tc-state" id="tc-state">检查控制面…</span>
  </div>

  <div class="tc-grid">
    <label class="tc-field tc-field-wide">扫描路径
      <input id="tc-scan-path" type="text" autocomplete="off" placeholder="留空 = 全库；也可以填课程子目录或 D:\ITJC\课程">
    </label>
    <div class="tc-actions">
      <button class="tc-btn primary" id="tc-scan" type="button">扫描路径</button>
      <span class="tc-hint" id="tc-scan-status">尚未扫描</span>
    </div>
  </div>

  <div class="tc-grid">
    <label class="tc-field tc-field-mid">候选范围
      <select id="tc-mode">
        <option value="missing_subtitles">只处理无字幕</option>
        <option value="missing_summary">只补总结</option>
        <option value="unfinished">继续未完成</option>
        <option value="all">全部重跑</option>
      </select>
    </label>
    <label class="tc-field tc-field-small">显示条数
      <input id="tc-limit" type="number" min="1" max="500" value="50">
    </label>
    <div class="tc-actions">
      <button class="tc-btn" id="tc-load" type="button">读取候选</button>
      <span class="tc-hint" id="tc-overview">库内统计读取中…</span>
    </div>
  </div>

  <div class="tc-table-wrap">
    <table class="tc-table" aria-label="候选视频">
      <thead>
        <tr>
          <th class="tc-check"><input id="tc-check-all" type="checkbox" aria-label="全选候选视频"></th>
          <th>视频</th>
          <th>时长</th>
          <th>字幕</th>
          <th>总结</th>
          <th>任务状态</th>
        </tr>
      </thead>
      <tbody id="tc-videos">
        <tr><td colspan="6" class="tc-empty">点“读取候选”查看待处理视频。</td></tr>
      </tbody>
    </table>
  </div>

  <div class="tc-selection">
    <button class="tc-btn" id="tc-preview" type="button">预览批量</button>
    <button class="tc-btn primary" id="tc-enqueue" type="button">入队任务</button>
    <span class="tc-hint" id="tc-selection-hint">未选择视频</span>
  </div>

  <div class="tc-grid">
    <div class="tc-actions">
      <span class="tc-hint" id="tc-queue">队列读取中…</span>
      <button class="tc-btn" id="tc-pause" type="button">暂停队列</button>
      <button class="tc-btn" id="tc-resume" type="button">恢复队列</button>
      <button class="tc-btn" id="tc-refresh-queue" type="button">刷新队列</button>
    </div>
  </div>

  <div class="tc-message" id="tc-message" role="status" aria-live="polite"></div>
</section>
<!-- /P2_TRANSCRIBE_HTML -->

<!-- P2_TRANSCRIBE_JS -->
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { videos: [], selected: new Set(), settings: null, scanTimer: null, busy: false, paused: false };

  function showMessage(text, kind = '') {
    const box = $('tc-message');
    if (!box) return;
    box.textContent = text;
    box.className = `tc-message show ${kind}`.trim();
  }

  async function request(path, options = {}) {
    const response = await fetch(path, {
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      ...options,
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(payload.detail || `HTTP ${response.status}`);
    }
    return payload;
  }

  function formatDuration(value) {
    const seconds = Number(value);
    if (!Number.isFinite(seconds) || seconds <= 0) return '--';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function statusPill(value) {
    const label = value || 'idle';
    const text = {
      idle: '待处理',
      queued: '排队中',
      running: '运行中',
      completed: '已完成',
      failed: '失败',
      cancelled: '已取消',
    }[label] || label;
    const cls = label === 'failed' ? 'bad' : label === 'queued' || label === 'running' ? 'warn' : label === 'completed' ? 'ok' : '';
    return `<span class="tc-pill ${cls}">${escapeHtml(text)}</span>`;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function renderVideos(payload) {
    state.videos = payload.items || [];
    state.selected = new Set(state.videos.map((item) => item.id));
    const body = $('tc-videos');
    if (!state.videos.length) {
      body.innerHTML = '<tr><td colspan="6" class="tc-empty">这个范围没有候选视频。</td></tr>';
    } else {
      body.innerHTML = state.videos.map((item) => `
        <tr>
          <td class="tc-check"><input type="checkbox" data-video-id="${item.id}" checked aria-label="选择 ${escapeHtml(item.title)}"></td>
          <td class="tc-title">
            <b title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</b>
            <small title="${escapeHtml(item.filename)}">${escapeHtml(item.filename)}</small>
          </td>
          <td class="mono">${formatDuration(item.duration)}</td>
          <td><span class="tc-pill ${item.has_subtitles ? 'ok' : ''}">${item.has_subtitles ? '有' : '无'}</span></td>
          <td><span class="tc-pill ${item.has_summary ? 'ok' : ''}">${item.has_summary ? '有' : '无'}</span></td>
          <td>${statusPill(item.ai_status)}</td>
        </tr>`).join('');
      body.querySelectorAll('input[data-video-id]').forEach((input) => {
        input.addEventListener('change', () => {
          const id = Number(input.dataset.videoId);
          if (input.checked) state.selected.add(id);
          else state.selected.delete(id);
          updateSelection();
        });
      });
    }
    const shown = state.videos.length;
    $('tc-selection-hint').textContent = `共 ${payload.total} 条候选，显示 ${shown} 条；已选 ${state.selected.size} 条`;
    $('tc-check-all').checked = state.selected.size > 0;
    updateSelection();
  }

  function updateSelection() {
    const hint = $('tc-selection-hint');
    if (!state.videos.length) {
      hint.textContent = '未加载候选视频';
      return;
    }
    hint.textContent = `共 ${state.videos.length} 条已加载，已选 ${state.selected.size} 条`;
    const all = $('tc-check-all');
    all.checked = state.videos.length > 0 && state.selected.size === state.videos.length;
    all.indeterminate = state.selected.size > 0 && state.selected.size < state.videos.length;
  }

  function setBusy(busy) {
    state.busy = busy;
    ['tc-scan', 'tc-load', 'tc-preview', 'tc-enqueue'].forEach((id) => {
      const button = $(id);
      if (button) button.disabled = busy;
    });
    const pause = $('tc-pause');
    const resume = $('tc-resume');
    if (pause) pause.disabled = busy || state.paused;
    if (resume) resume.disabled = busy || !state.paused;
  }

  async function loadConfig() {
    try {
      const config = await request('/api/console/config');
      const status = $('tc-state');
      if (!config.token_configured) {
        status.textContent = '未配置 OPS_TOKEN';
        status.className = 'tc-state bad';
        showMessage('控制面未连接：请在 .env 设置 OPS_TOKEN，然后重启 backend 和本控制台。', 'bad');
        return;
      }
      status.textContent = `已连接 · ${config.backend}`;
      status.className = 'tc-state ok';
    } catch (error) {
      $('tc-state').textContent = '控制面离线';
      $('tc-state').className = 'tc-state bad';
      showMessage(error.message, 'bad');
    }
  }

  async function loadSettings() {
    try {
      state.settings = await request('/api/console/settings');
    } catch (error) {
      state.settings = null;
      showMessage(`读取转写默认值失败：${error.message}`, 'bad');
    }
  }

  async function loadOverview() {
    try {
      const overview = await request('/api/console/overview');
      const videos = overview.videos || {};
      $('tc-overview').innerHTML = `库内 <strong>${videos.total ?? 0}</strong> · 有字幕 <strong>${videos.with_subtitles ?? 0}</strong> · 无字幕 <strong>${videos.without_subtitles ?? 0}</strong> · 有总结 <strong>${videos.with_summary ?? 0}</strong>`;
      updateQueue(overview.queue || {});
    } catch (error) {
      $('tc-overview').textContent = `统计不可用：${error.message}`;
    }
  }

  async function loadVideos() {
    setBusy(true);
    try {
      const mode = $('tc-mode').value;
      const limit = $('tc-limit').value || 50;
      const payload = await request(`/api/console/videos?mode=${encodeURIComponent(mode)}&limit=${encodeURIComponent(limit)}`);
      renderVideos(payload);
      showMessage(`已读取 ${payload.items.length} 条候选（范围共 ${payload.total} 条）。`);
    } catch (error) {
      showMessage(`读取候选失败：${error.message}`, 'bad');
    } finally {
      setBusy(false);
    }
  }

  function batchPayload(dryRun) {
    const ids = [...state.selected];
    if (!ids.length) throw new Error('先勾选至少一个视频。');
    if (!state.settings) throw new Error('转写默认值未加载，不能安全入队。');
    const settings = state.settings;
    return {
      video_ids: ids,
      mode: $('tc-mode').value,
      max_enqueue: ids.length,
      dry_run: dryRun,
      at_front: false,
      whisper_engine: settings.whisper_engine,
      whisper_model: settings.whisper_model,
      language: settings.language,
      do_summary: settings.do_summary,
      word_limit: settings.word_limit,
      cpu_threads: settings.cpu_threads,
      compute_type: settings.compute_type,
      beam_size: settings.beam_size,
      best_of: settings.best_of,
      temperature: settings.temperature,
      vad_filter: settings.vad_filter,
      subtitle_correction_enabled: settings.subtitle_correction_enabled,
      subtitle_correction_scope: settings.subtitle_correction_scope,
      subtitle_correction_prompt: settings.subtitle_correction_prompt,
      device_type: settings.device_type,
    };
  }

  function formatBatchResult(result, dryRun) {
    const lines = [
      `${dryRun ? '预览' : '已提交'}：范围 ${result.requested} 条，可入队 ${result.eligible} 条。`,
      `已跳过 ${result.skipped} 条；已存在/完成 ${result.already_done} 条；失败待重试 ${result.failed} 条；运行中 ${result.active} 条。`,
    ];
    if (result.limited) lines.push(`受单次上限限制，仅处理前 ${result.max_enqueue} 条。`);
    if (!dryRun) lines.push(result.enqueued ? `已创建 ${result.enqueued} 个任务。` : '没有新建任务；可能是队列暂停或全部已完成。');
    return lines.join('\n');
  }

  async function runBatch(dryRun) {
    setBusy(true);
    try {
      const payload = batchPayload(dryRun);
      if (!dryRun) {
        const ok = window.confirm(`确认把 ${payload.video_ids.length} 个视频提交到转写 / 总结队列？`);
        if (!ok) return;
      }
      const result = await request('/api/console/batch', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      showMessage(formatBatchResult(result, dryRun), result.enqueued || dryRun ? 'ok' : 'bad');
      await loadOverview();
      await loadVideos();
    } catch (error) {
      showMessage(`${dryRun ? '预览' : '入队'}失败：${error.message}`, 'bad');
    } finally {
      setBusy(false);
    }
  }

  function updateQueue(queue) {
    const paused = Boolean(queue.paused);
    state.paused = paused;
    $('tc-queue').textContent = `队列：运行 ${queue.running ?? 0} / 排队 ${queue.queued ?? 0} / 失败 ${queue.failed ?? 0} · ${paused ? '已暂停' : '运行中'}`;
    $('tc-pause').disabled = state.busy || paused;
    $('tc-resume').disabled = state.busy || !paused;
  }

  async function loadQueue() {
    try {
      updateQueue(await request('/api/console/queue'));
    } catch (error) {
      $('tc-queue').textContent = `队列不可用：${error.message}`;
    }
  }

  async function setQueue(action) {
    setBusy(true);
    try {
      await request(`/api/console/queue/${action}`, { method: 'POST', body: '{}' });
      showMessage(action === 'pause' ? '队列已暂停；新任务只入 DB，不会推给 RQ。' : '队列已恢复，等待中的任务会回到 RQ。', 'ok');
      await loadQueue();
      await loadOverview();
    } catch (error) {
      showMessage(`队列操作失败：${error.message}`, 'bad');
    } finally {
      setBusy(false);
    }
  }

  async function scan() {
    const path = $('tc-scan-path').value.trim();
    if (!path && !window.confirm('扫描路径为空，将扫描整个视频库。全库扫描会清理已消失的记录，确认继续？')) {
      $('tc-scan-status').textContent = '已取消全库扫描';
      return;
    }
    setBusy(true);
    $('tc-scan-status').textContent = '正在提交扫描…';
    try {
      const result = await request('/api/console/scan', {
        method: 'POST',
        body: JSON.stringify({ path }),
      });
      if (!result.started && result.running) {
        $('tc-scan-status').textContent = '已有扫描在进行';
      } else {
        $('tc-scan-status').textContent = '扫描已启动，后台进行中…';
      }
      startScanPolling();
    } catch (error) {
      $('tc-scan-status').textContent = `扫描失败：${error.message}`;
      showMessage(`扫描失败：${error.message}`, 'bad');
    } finally {
      setBusy(false);
    }
  }

  async function pollScan() {
    try {
      const status = await request('/api/console/scan/status');
      if (status.running) {
        $('tc-scan-status').textContent = status.message ? `扫描进行中…（${status.message}）` : '扫描进行中…';
        return;
      }
      stopScanPolling();
      if (status.error) {
        $('tc-scan-status').textContent = `扫描结束：${status.error}`;
        showMessage(`扫描未完成：${status.error}`, 'bad');
        return;
      }
      if (status.result && status.result.status === 'ok') {
        const r = status.result;
        $('tc-scan-status').textContent = `扫描完成：新增 ${r.added ?? 0}，移除 ${r.removed ?? 0}，库内 ${r.total ?? 0}`;
        showMessage(`扫描完成：${status.target || '全库'}；新增 ${r.added ?? 0}，移除 ${r.removed ?? 0}。`, 'ok');
        await loadOverview();
        await loadVideos();
      }
    } catch (error) {
      stopScanPolling();
      $('tc-scan-status').textContent = `扫描状态读取失败：${error.message}`;
    }
  }

  function startScanPolling() {
    stopScanPolling();
    state.scanTimer = window.setInterval(pollScan, 1500);
    void pollScan();
  }

  function stopScanPolling() {
    if (state.scanTimer) window.clearInterval(state.scanTimer);
    state.scanTimer = null;
  }

  function bind() {
    $('tc-check-all').addEventListener('change', (event) => {
      const checked = event.target.checked;
      state.selected = checked ? new Set(state.videos.map((item) => item.id)) : new Set();
      document.querySelectorAll('#tc-videos input[data-video-id]').forEach((input) => {
        input.checked = checked;
      });
      updateSelection();
    });
    $('tc-load').addEventListener('click', loadVideos);
    $('tc-preview').addEventListener('click', () => runBatch(true));
    $('tc-enqueue').addEventListener('click', () => runBatch(false));
    $('tc-scan').addEventListener('click', scan);
    $('tc-pause').addEventListener('click', () => setQueue('pause'));
    $('tc-resume').addEventListener('click', () => setQueue('resume'));
    $('tc-refresh-queue').addEventListener('click', loadQueue);
  }

  async function boot() {
    bind();
    await loadConfig();
    await loadSettings();
    await loadOverview();
    await loadQueue();
    await loadVideos();
    void pollScan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
