# 共享 2GB PostgreSQL 基线参数（P1/P2/P3/P4 分 database，不建 vector）
#
# 目标：一台 2GB 内存的 PG 容器里跑 4 个 OLTP 库 + P2 Lite 的轻量业务表。
# 关键取舍：
#   - shared_buffers 512MB：给 OS page cache 和容器开销留一半
#   - work_mem 4MB：排序/哈希连接压低，避免并发时内存爆
#   - max_connections 30：P1 + P2 Lite 同时在线约 20~25 条连接，
#     给迁移/健康检查留余量；不要 4 个项目同时开满池
#   - effective_cache_size 1GB：告诉规划器 OS 还有缓存，不等于实际分配
#   - autovacuum 保持开启：小库也怕表膨胀，尤其 notes / chat / action 表

listen_addresses = '*'
port = 5432

max_connections = 30
superuser_reserved_connections = 2

shared_buffers = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
wal_buffers = 16MB

# 共享实例上不让单条查询无限跑，也不让事务挂着不放
statement_timeout = 60s
idle_in_transaction_session_timeout = 60s

# 磁盘写入节奏：演示库不需要激进 checkpoint
checkpoint_timeout = 15min
max_wal_size = 1GB
min_wal_size = 256MB

# SSD 上随机读成本低；机械盘改回 4.0
random_page_cost = 1.1
effective_io_concurrency = 200

autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
deadlock_timeout = 5s

# 共享 PG 只允许密码认证；角色权限按 database 隔离
password_encryption = scram-sha-256
