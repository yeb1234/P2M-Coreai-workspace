# 检索主链路参数。
#
# 这张文件由「设置 → 配置资产版本库」纳管：每次修改都是一次可对比、
# 可回滚的提交；发布动作会把当前分支的最新快照原子写回本文件。
# 运行时每次检索都会读取缓存，发布后自动失效缓存，无需重启进程。

version: 1
rrf_k: 60
candidate_k: 30
rerank_top_n: 20
weights:
  lexical: 0.8
  vector: 1.2
  meta: 1.5
# 检索召回低于该分数时不进入重排，避免把噪声送进 LLM。
min_vector_score: 0.15
# 单次查询最多展开的分类数，防止权限过滤后扫全表。
max_category_fanout: 32
# 查询向量缓存有效期（秒）。同一句话在会话内重复检索很常见。
query_embedding_cache_ttl_s: 900
