# P2 Learning OS 网关配置
#
# 为什么是完整配置而不是 conf.d 片段：
# limit_req_zone 只能定义在 http 块里，conf.d/*.conf 属于已进入 http 的子上下文，
# 写在那里会直接启动失败。所以这里接管 /etc/nginx/nginx.conf。
#
# 分三层防护：
# 1. 连接层：limit_conn 防单 IP 打满连接
# 2. 请求层：limit_req 按路径分档，登录最严，静态资源不限
# 3. 应用层：后端自己还有基于用户维度的限流（见 services/rate_limit.py）

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 加 upstream 响应时间，排查慢请求时不用再猜
    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 不回显版本号，减少被针对性扫描的面
    server_tokens   off;

    # ---- 真实客户端 IP ----
    #
    # 放到腾讯云 CLB 后面时，nginx 看到的 $remote_addr 是 CLB 的内网 IP。
    # 不还原真实 IP 会同时坏三件事：
    #   1. limit_req 按 IP 计数变成「所有用户共用一个桶」，一个人刷满全员 429
    #   2. 登录失败锁定会误伤所有人
    #   3. 访问日志全是 LB 的 IP，出事查不到人
    #
    # 只信任内网段：公网客户端即使伪造 X-Forwarded-For 也不会被采纳，
    # 因为它的源地址不在下面这些网段里。
    # 上云后建议把 CIDR 收紧到 CLB 的实际网段（控制台可查），不必留这么宽。
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    set_real_ip_from   100.64.0.0/10;    # 腾讯云 CLB 常用段
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 慢连接防护：客户端只发头不发体时不要一直占着 worker
    client_body_timeout   20s;
    client_header_timeout 20s;
    send_timeout          60s;

    # ---- 限流区 ----
    # 登录/注册：单 IP 每分钟 20 次，允许 10 次突发
    limit_req_zone  $binary_remote_addr zone=login_zone:10m rate=20r/m;
    # 普通 API：单 IP 每秒 30 次
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=30r/s;
    # 单 IP 并发连接
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    upstream backend_upstream {
        server backend:8000;
        # 长连接复用，避免每个 API 请求都重新握手
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;
        limit_conn conn_zone 40;
        client_max_body_size 20m;

        # ---- 安全响应头 ----
        # 注意：location 里只要出现 add_header 就会清空这里继承的全部头，
        # 所以下面每个带 add_header 的 location 都单独 include 了一次
        include /etc/nginx/security-headers.conf;

        # ---- 代理公共头 ----
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- 认证：单独限流 ----
        location = /api/auth/login {
            limit_req zone=login_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
        }

        location = /api/auth/register {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
        }

        # ---- 流式对话：必须关缓冲 ----
        location /api/assistant/chat/stream {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
            proxy_buffering off;
            proxy_cache off;
            # 长回答 + 工具调用可能跑很久
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ---- 其余 API ----
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_upstream;
            # 路径规划 20-30 秒，检索重排可能到 8 秒
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50m;
        }

        # ---- 后端产物 ----
        location /output/ {
            proxy_pass http://backend_upstream/output/;
        }
        location /thumbnails/ {
            proxy_pass http://backend_upstream/thumbnails/;
            expires 7d;
        }
        location /sprites/ {
            proxy_pass http://backend_upstream/sprites/;
            expires 7d;
        }

        # ---- 探活：不记日志，避免刷屏 ----
        location = /health {
            proxy_pass http://backend_upstream/health;
            access_log off;
        }
        location = /ready {
            proxy_pass http://backend_upstream/ready;
            access_log off;
        }

        # ---- 前端静态资源长缓存 ----
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        location ~* \.(ogg|wav)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            include /etc/nginx/security-headers.conf;
        }

        # index.html 不缓存，保证发版后立刻生效
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            include /etc/nginx/security-headers.conf;
        }

        # 浏览器总会探测，直接回 204 消除控制台 404
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # 明确拒绝的路径：即使后端误开了文档，这里也不放出去
        location = /api/openapi.json { return 404; }
        location ~ ^/api/docs { return 404; }
    }
}
