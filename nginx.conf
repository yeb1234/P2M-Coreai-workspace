server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SSE 与长响应需要放宽超时
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 流式对话单独处理：必须关闭缓冲，否则 token 会被攒成一整块再发
    location /api/assistant/chat/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 其余 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 学习路径规划是 20-30 秒的重任务，检索重排也可能到 8 秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # 后端直接提供的静态目录（视频封面、雪碧图、字幕产物）
    location /output/ {
        proxy_pass http://backend:8000/output/;
        proxy_set_header Host $host;
    }
    location /thumbnails/ {
        proxy_pass http://backend:8000/thumbnails/;
        proxy_set_header Host $host;
    }
    location /sprites/ {
        proxy_pass http://backend:8000/sprites/;
        proxy_set_header Host $host;
    }

    # 健康检查透传，方便从宿主机直接探活
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # 前端静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 声音资源不必永久缓存
    location ~* \.(ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 浏览器总会探测 /favicon.ico，而项目只提供 favicon.svg。
    # 直接回 204，避免控制台里一直挂一条 404。
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}
