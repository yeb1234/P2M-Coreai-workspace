# 安全响应头（被多个 location 共用）
#
# 为什么要单独成文件：
# nginx 的 add_header 有一个反直觉的规则 —— 只要子块（location）里出现了
# 任意一个 add_header，就会**清空从父块继承来的全部 add_header**，
# 而不是追加。所以 server 块写了安全头，一进 location = /index.html
# （那里为了禁缓存写了 add_header Cache-Control）就全部失效了。
#
# 因此每个带 add_header 的 location 都必须显式 include 一次本文件。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# 不限制 script-src：Vite 产物含内联引导代码，收紧会白屏。
# 这里只锁住「谁能嵌我们的页面」和「不能加载插件对象」。
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
